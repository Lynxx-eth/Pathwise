<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — Pathwise</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-mascot"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
  <path d="M20 2v4" />
  <path d="M22 4h-4" />
  <circle cx="4" cy="20" r="2" /></svg></div>
      <h1 style="font-size:23px; margin-bottom:6px;">Start your streak</h1>
      <p style="color:var(--ink-soft); font-size:13.5px; margin-bottom:26px;">Free for students. Takes about a minute.</p>

      <div class="field">
        <label>Full name</label>
        <input type="text" placeholder="Ada Lovelace" />
      </div>
      <div class="field">
        <label>School email</label>
        <input type="email" placeholder="you@university.edu" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="Create a password" />
      </div>

      <a href="privacy.html" class="btn btn-primary btn-block" style="margin-top:6px;">Create account</a>

      <div class="divider">OR</div>

      <button class="btn btn-ghost btn-block">Continue with Google</button>

      <p style="text-align:center; font-size:13px; color:var(--ink-soft); margin-top:22px;">
        Already have an account? <a href="sign-in.html" style="color:var(--primary); font-weight:700;">Sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
