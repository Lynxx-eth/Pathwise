<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Pathwise</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-mascot"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3" />
  <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" />
  <path d="M5 21h14" /></svg></div>
      <h1 style="font-size:23px; margin-bottom:6px;">Welcome back</h1>
      <p style="color:var(--ink-soft); font-size:13.5px; margin-bottom:26px;">Pick up your streak where you left off.</p>

      <div class="field">
        <label>School email</label>
        <input type="email" placeholder="you@university.edu" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" />
      </div>

      <a href="courses.html" class="btn btn-primary btn-block" style="margin-top:6px;">Sign in</a>

      <div class="divider">OR</div>

      <button class="btn btn-ghost btn-block">Continue with Google</button>

      <p style="text-align:center; font-size:13px; color:var(--ink-soft); margin-top:22px;">
        New here? <a href="sign-up.html" style="color:var(--primary); font-weight:700;">Create an account</a>
      </p>
    </div>
  </div>
</body>
</html>
